name: mongory-spec conformance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "mongory-spec ref (branch, tag, or SHA) to test against"
        required: false
        default: "main"

jobs:
  conformance:
    runs-on: ubuntu-latest
    name: Conformance on Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '2.6'
            bundler: '2.1.4'
          - ruby: '3.4'
            bundler: '2.5.6'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Checkout mongory-spec
      uses: actions/checkout@v4
      with:
        repository: mongoryhq/mongory-spec
        ref: ${{ github.event.inputs.spec_ref || 'main' }}
        path: mongory-spec

    - name: Show mongory-spec revision
      working-directory: mongory-spec
      run: |
        echo "mongory-spec $(cat VERSION) @ $(git rev-parse --short HEAD)"

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler: ${{ matrix.bundler }}
        bundler-cache: true

    - name: Build native extension (mongory-core)
      run: bundle exec rake build_all

    - name: Run conformance tests (QueryMatcher + CMatcher)
      env:
        MONGORY_SPEC_DIR: ${{ github.workspace }}/mongory-spec
      run: bundle exec rspec spec/conformance_spec.rb
